[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; 端口来自容器环境变量 API_PORT / PANEL_PORT（Dockerfile 有默认值，
; docker compose 可通过 .env 覆盖）。%(ENV_x)s 由 supervisord 自身环境展开。

; ---------------------------------------------------------------
; API（OpenAI / Anthropic / Responses 兼容入口）
; 默认 3009，只在容器内网监听 —— 对外统一由 panel 的 3008 反代 /v1/*。
; ---------------------------------------------------------------
[program:converter]
command=python3 /app/converter.py --host 127.0.0.1 --port %(ENV_API_PORT)s --skip-check --desensitize --api-key-file /data/auth/.api_key
environment=CODEBUDDY_AUTH_DIR="/data/auth"
autostart=true
autorestart=true
startsecs=4
stopasgroup=true
killasgroup=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; ---------------------------------------------------------------
; Web UI（管理面板）—— 唯一对外入口，默认 3008
; ---------------------------------------------------------------
[program:panel]
command=python3 /app/panel.py
environment=CODEBUDDY_AUTH_DIR="/data/auth",PANEL_PORT="%(ENV_PANEL_PORT)s",API_PORT="%(ENV_API_PORT)s",CONVERTER_BASE="http://127.0.0.1:%(ENV_API_PORT)s"
autostart=true
autorestart=true
startsecs=4
stopasgroup=true
killasgroup=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
